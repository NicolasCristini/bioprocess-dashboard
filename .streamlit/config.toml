redColor = "#B4323A"
orangeColor = "#99600E"
yellowColor = "#99600E"
blueColor = "#2F6BC7"
greenColor = "#0F685A"
font = "Geist"
headingFont = "Geist"
codeFont = "Geist Mono"
baseFontSize = 15
headingFontWeights = [600, 600, 600, 600, 600, 600]
metricValueFontWeight = 500
baseRadius = "10px"
buttonRadius = "full"
showSidebarBorder = true
chartCategoricalColors = ["#0F685A", "#D9822B", "#2F6BC7", "#C8414B", "#A8892A", "#7D5BB8", "#6B7280"]

[[theme.fontFaces]]
