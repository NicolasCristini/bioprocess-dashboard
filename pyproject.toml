[project]
name = "bioprocess-dashboard"
version = "0.1.0"
description = "Browser-based planner for batch, fed-batch and continuous cell-culture processes"
requires-python = ">=3.13,<3.14"   # matches the Pyodide/Python version stlite ships
dependencies = [
    "numpy",
    "pandas",
    "plotly",
    "pydantic>=2",
    "pyyaml",
    "openpyxl",
]

[project.optional-dependencies]
dev = ["pytest", "streamlit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bioprocess"]

[tool.pytest.ini_options]
testpaths = ["tests"]
